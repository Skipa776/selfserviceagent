<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
  <title id="title">Campus Issue Reporter service architecture</title>
  <desc id="desc">Architecture showing campus callers, the local HTTP service, AI parsing with keyword fallback, deterministic controls, ServiceNow read and create access, and the isolated analyst workspace.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#46637f"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#182b49" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #182b49; }
      .subtitle { font: 18px Arial, sans-serif; fill: #52677d; }
      .section { font: 700 17px Arial, sans-serif; fill: #182b49; letter-spacing: 1px; }
      .heading { font: 700 20px Arial, sans-serif; fill: #182b49; }
      .body { font: 15px Arial, sans-serif; fill: #263746; }
      .small { font: 13px Arial, sans-serif; fill: #52677d; }
      .box { fill: #ffffff; stroke: #9eb2c5; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .blue { fill: #e9f4fa; stroke: #00629b; }
      .gold { fill: #fff7d1; stroke: #c69214; }
      .green { fill: #e8f5ee; stroke: #21835a; }
      .gray { fill: #f3f5f7; stroke: #8091a3; }
      .red { fill: #fff0ef; stroke: #b33a3a; }
      .line { fill: none; stroke: #46637f; stroke-width: 2.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #8091a3; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="980" fill="#f7f4ec"/>
  <rect x="0" y="0" width="1440" height="12" fill="#ffcd00"/>
  <text x="70" y="70" class="title">Campus Issue Reporter</text>
  <text x="70" y="103" class="subtitle">AI-assisted parsing, deterministic duplicate control, and ServiceNow ticket creation</text>

  <text x="70" y="158" class="section">CALLERS</text>
  <rect x="70" y="180" width="250" height="110" class="box blue"/>
  <text x="195" y="218" text-anchor="middle" class="heading">Campus user</text>
  <text x="195" y="248" text-anchor="middle" class="body">Student, faculty, or staff</text>
  <text x="195" y="272" text-anchor="middle" class="small">Plain-language complaint</text>

  <rect x="390" y="180" width="260" height="110" class="box gray"/>
  <text x="520" y="218" text-anchor="middle" class="heading">Thin caller</text>
  <text x="520" y="248" text-anchor="middle" class="body">TSS / campus AI assistant / web form</text>
  <text x="520" y="272" text-anchor="middle" class="small">Passes text and renders reply</text>
  <path d="M320 235 H390" class="line"/>

  <text x="70" y="350" class="section">REPORT SERVICE</text>
  <rect x="70" y="372" width="1300" height="355" rx="20" fill="#eef3f7" stroke="#182b49" stroke-width="2"/>

  <rect x="105" y="415" width="210" height="115" class="box blue"/>
  <text x="210" y="452" text-anchor="middle" class="heading">HTTP boundary</text>
  <text x="210" y="481" text-anchor="middle" class="body">POST /report</text>
  <text x="210" y="505" text-anchor="middle" class="small">Validate request shape</text>

  <rect x="365" y="395" width="260" height="155" class="box gold"/>
  <text x="495" y="432" text-anchor="middle" class="heading">Parser seam</text>
  <text x="495" y="462" text-anchor="middle" class="body">Lightweight LLM</text>
  <text x="495" y="486" text-anchor="middle" class="small">Schema validation + one repair</text>
  <text x="495" y="520" text-anchor="middle" class="body">Keyword fallback</text>
  <text x="495" y="540" text-anchor="middle" class="small">No credentials required</text>

  <rect x="675" y="395" width="300" height="155" class="box green"/>
  <text x="825" y="432" text-anchor="middle" class="heading">Deterministic lifecycle</text>
  <text x="825" y="461" text-anchor="middle" class="body">Identity → throttle → completeness</text>
  <text x="825" y="486" text-anchor="middle" class="body">Search → reduce → decide</text>
  <text x="825" y="511" text-anchor="middle" class="small">Distinct reporters, time window,</text>
  <text x="825" y="532" text-anchor="middle" class="small">idempotency, override handling</text>

  <rect x="1025" y="415" width="300" height="115" class="box blue"/>
  <text x="1175" y="452" text-anchor="middle" class="heading">Response composer</text>
  <text x="1175" y="481" text-anchor="middle" class="body">Fixed user-facing templates</text>
  <text x="1175" y="505" text-anchor="middle" class="small">Never model-authored status</text>

  <path d="M650 235 H700 V360 H210 V415" class="line"/>
  <path d="M315 472 H365" class="line"/>
  <path d="M625 472 H675" class="line"/>
  <path d="M975 472 H1025" class="line"/>
  <path d="M1175 415 V330 H520 V290" class="line"/>

  <rect x="365" y="590" width="260" height="95" class="box gray"/>
  <text x="495" y="625" text-anchor="middle" class="heading">Audit + feedback</text>
  <text x="495" y="653" text-anchor="middle" class="small">Structured events and rejected matches</text>

  <rect x="675" y="590" width="300" height="95" class="box gray"/>
  <text x="825" y="625" text-anchor="middle" class="heading">Pattern detector</text>
  <text x="825" y="653" text-anchor="middle" class="small">Advisory candidate only, never outage status</text>
  <path d="M825 550 V590" class="dash"/>
  <path d="M675 638 H625" class="dash"/>

  <text x="70" y="790" class="section">EXTERNAL SYSTEMS AND ISOLATED TOOLS</text>
  <rect x="70" y="815" width="310" height="115" class="box gold"/>
  <text x="225" y="851" text-anchor="middle" class="heading">AI provider</text>
  <text x="225" y="880" text-anchor="middle" class="body">OpenAI-compatible chat completions</text>
  <text x="225" y="904" text-anchor="middle" class="small">Recommended: Gemini 3.5 Flash Lite</text>
  <path d="M430 550 V760 H225 V815" class="dash"/>

  <rect x="460" y="795" width="355" height="155" class="box blue"/>
  <text x="638" y="832" text-anchor="middle" class="heading">ServiceNow Table API</text>
  <text x="638" y="862" text-anchor="middle" class="body">GET active INC / REQ records</text>
  <text x="638" y="888" text-anchor="middle" class="body">POST at most one INC / REQ</text>
  <text x="638" y="918" text-anchor="middle" class="small">No update, close, assign, or resolve method</text>
  <path d="M825 550 V750 H638 V795" class="line"/>

  <rect x="895" y="795" width="475" height="155" class="box red"/>
  <text x="1133" y="832" text-anchor="middle" class="heading">Analyst workspace</text>
  <text x="1133" y="862" text-anchor="middle" class="body">Model comparison + evidence snapshots</text>
  <text x="1133" y="888" text-anchor="middle" class="body">Human-approved local SHARED-DEMO record</text>
  <text x="1133" y="918" text-anchor="middle" class="small">Isolated shadow mode, no ServiceNow writes</text>
  <path d="M825 685 V760 H1133 V795" class="dash"/>

  <text x="70" y="965" class="small">Solid arrows: synchronous request path. Dashed arrows: fallback, telemetry, or isolated analysis path.</text>
</svg>
