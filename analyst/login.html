<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Incident Analyst Login</title>
  <style>
    body { margin: 0; background: #f5f2ea; color: #17212b; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 520px; margin: 12vh auto; padding: 28px; background: white; border: 1px solid #d8dee5; border-top: 6px solid #ffcd00; border-radius: 12px; box-shadow: 0 10px 32px rgb(24 43 73 / 10%); }
    h1 { color: #182b49; }
    label { display: block; margin: 18px 0 6px; font-weight: 700; }
    input { width: 100%; padding: 11px; border: 1px solid #96a3af; border-radius: 7px; }
    button { margin-top: 14px; border: 0; border-radius: 7px; padding: 11px 16px; color: white; background: #00629b; font-weight: 700; cursor: pointer; }
    #error { color: #9c2c2c; }
  </style>
</head>
<body>
  <main>
    <p><strong>Experimental · PDI only</strong></p>
    <h1>AI Incident Analyst</h1>
    <p>Enter the one-use operator token printed by <code>npm run demo:analyst</code>.</p>
    <form id="login">
      <label for="token">Operator token</label>
      <input id="token" name="token" type="password" autocomplete="off" required>
      <button type="submit">Start review session</button>
    </form>
    <p id="error" role="alert"></p>
  </main>
  <script>
    document.getElementById('login').addEventListener('submit', async event => {
      event.preventDefault();
      const token = document.getElementById('token').value;
      const response = await fetch('/operator/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ token }),
      });
      if (!response.ok) {
        document.getElementById('error').textContent = 'Invalid or already-used token.';
        return;
      }
      sessionStorage.setItem('analystCsrf', response.headers.get('x-csrf-token') || '');
      location.href = '/operator';
    });
  </script>
</body>
</html>
